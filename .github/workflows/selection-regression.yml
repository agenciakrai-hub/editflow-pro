name: EditFlow Pro selection regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  selection-grouping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test conservative grouping fallback
        run: node tests/group-builder-fail-closed.mjs
